# 1. Server kis port par chalega (By default 8080)
server.port=8080

# 2. Database ka URL (edunet_db database se connect karega)
spring.datasource.url=jdbc:mysql://localhost:3306/edunet_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# 3. MySQL ka Username (Default 'root' hota hai)
spring.datasource.username=root

# 4. MySQL ka Password (Jo password aap MySQL install karte waqt banaye the)
spring.datasource.password=root

# 5. Hibernate/JPA Settings (Ye automatically tables bana dega)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
